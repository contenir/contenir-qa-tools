name: "Continuous Integration"

on:
  workflow_call:
    inputs:
      php-versions:
        description: "JSON array of PHP versions for the mago and test matrices, e.g. '[\"8.3\", \"8.4\"]'. Match the range composer.json's require.php allows. The first entry is the coverage version when coverage-php-version is empty."
        type: string
        required: false
        default: '["8.2", "8.3", "8.4", "8.5"]'
      dependency-versions:
        description: "JSON array of dependency strategies for the test matrix: \"lowest\" (composer update --prefer-lowest), \"locked\" (composer install from composer.lock) and \"latest\" (composer update). Libraries keep all three; applications, which deploy their lock file, pass '[\"locked\"]'. Coverage and mutation testing run on the locked leg, so keep \"locked\" in the list when either is enabled."
        type: string
        required: false
        default: '["lowest", "locked", "latest"]'
      php-extensions:
        description: "Comma-separated PHP extensions for shivammathur/setup-php in every job that installs dependencies (mago, test, mutation-test), e.g. \"intl, pdo_mysql, gd\". Needed whenever composer.json requires ext-* packages the runner image lacks. Empty = the image defaults."
        type: string
        required: false
        default: ""
      run-integration:
        description: "Run the integration suite (the integration-test-script) after the unit suite on every test leg."
        type: boolean
        required: false
        default: false
      composer-options:
        description: "Extra flags appended to every composer install/update, e.g. \"--ignore-platform-req=ext-oci8\"."
        type: string
        required: false
        default: ""
      dotenv:
        description: "Contents written to .env in the repository root before dependencies are installed in the test and mutation-test jobs, for applications that load .env at boot (e.g. vlucas/phpdotenv's createImmutable, which throws when the file is missing). Use test-env-json instead when real environment variables are enough. Empty = no file."
        type: string
        required: false
        default: ""
      test-env-json:
        description: "JSON object of extra env vars exported (via $GITHUB_ENV) before the tests run in test and mutation-test, e.g. to override a phpunit.xml.dist connection setting for CI, since PHPUnit's <env> won't override an already-set real env var."
        type: string
        required: false
        default: "{}"
      apt-packages:
        description: "Space-separated Ubuntu packages installed with apt-get before the test and mutation-test jobs run (e.g. \"imagemagick\" for a CLI the tests shell out to). Empty = none."
        type: string
        required: false
        default: ""
      test-script:
        description: "Composer script that runs the unit suite on every test leg except the coverage leg."
        type: string
        required: false
        default: "test"
      test-coverage-script:
        description: "Composer script that runs the unit suite with coverage on the coverage leg. It must write clover.xml to the repository root."
        type: string
        required: false
        default: "test-coverage"
      integration-test-script:
        description: "Composer script that runs the integration suite when run-integration is true."
        type: string
        required: false
        default: "test-integration"
      mutation-test-script:
        description: "Composer script that runs Infection in the mutation-test job; the workflow appends --min-msi, --min-covered-msi and --logger-github."
        type: string
        required: false
        default: "mutation-test"
      mago-version:
        description: "Mago release installed by shivammathur/setup-php in the mago and mutation-test jobs, e.g. \"1.57.0\". Pinned because each Mago release can change formatter output and analyzer findings; bumping it means reformatting and regenerating the lint and analysis baselines in the consumer. Use an exact release tag: setup-php silently installs the latest release when the tag doesn't exist."
        type: string
        required: false
        default: "1.57.0"
      mago-guard:
        description: "Run mago guard in the mago job (architectural rules from the [guard] section of mago.toml)."
        type: boolean
        required: false
        default: true
      enable-rector:
        description: "Run vendor/bin/rector process --dry-run in the mago job, failing when Rector would change code. Requires rector/rector in require-dev and a rector.php."
        type: boolean
        required: false
        default: false
      enable-composer-validate:
        description: "Turn on the composer job's composer validate --strict step."
        type: boolean
        required: false
        default: false
      enable-composer-audit:
        description: "Turn on the composer job's composer audit --locked step, failing on known security advisories in the locked dependencies (abandoned packages are reported, not failed)."
        type: boolean
        required: false
        default: false
      db-image:
        description: "Container image for the DB service (e.g. mysql:8.0). Empty = no DB."
        type: string
        required: false
        default: ""
      db-env-json:
        description: "JSON object of DB container env vars."
        type: string
        required: false
        default: "{}"
      db-port:
        description: "Port to expose/map for the DB container."
        type: string
        required: false
        default: ""
      db-health-cmd:
        description: "Command run via docker exec to check DB readiness."
        type: string
        required: false
        default: ""
      db-health-retries:
        description: "Max DB health-check attempts. Raise for slow-starting engines (Oracle, MSSQL)."
        type: number
        required: false
        default: 30
      db-health-interval-seconds:
        description: "Seconds to sleep between DB health-check attempts."
        type: number
        required: false
        default: 2
      enable-codecov:
        description: "Run the codecov job, which uploads the coverage leg's clover.xml. On by default; set false to opt out. Needs the CODECOV_TOKEN secret; a failed upload fails the build."
        type: boolean
        required: false
        default: true
      enable-infection:
        description: "Run the mutation-test job. On by default; set false to opt out. Needs infection/infection in require-dev, an infection.json5(.dist) and the mutation-test-script."
        type: boolean
        required: false
        default: true
      coverage-php-version:
        description: "Which php-versions entry runs coverage and mutation testing. Empty = the first php-versions entry."
        type: string
        required: false
        default: ""
      min-msi:
        description: "Minimum Mutation Score Indicator (%) required to pass the mutation-test job."
        type: string
        required: false
        default: "10"
      min-covered-msi:
        description: "Minimum covered-code MSI (%) required to pass the mutation-test job."
        type: string
        required: false
        default: "10"
      infection-diff-on-pull-requests:
        description: "On pull_request events, mutate only the lines the pull request changes (Infection --git-diff-lines against the base branch), and pass when it changes no mutable code. Push events still run the whole suite, so the MSI gate and the Stryker badge keep covering everything. Off by default."
        type: boolean
        required: false
        default: false
      boot-cms:
        description: "Run the boot-cms job, for Contenir add-ons: install this repository's add-on into the CMS's latest release, enable it on the CMS's end-to-end site and check the site boots with it (sign-in page, update check, Site Settings > Extensions, and the boot-cms-pages). Needs the contenir-autodev app (the AUTODEV_APP_ID variable and AUTODEV_APP_PRIVATE_KEY secret) to read the private CMS repository."
        type: boolean
        required: false
        default: false
      boot-cms-ref:
        description: "CMS tag or branch the boot-cms job checks out. Empty = the highest vX.Y.Z tag, which is the current release."
        type: string
        required: false
        default: ""
      boot-cms-pages:
        description: "JSON array of admin paths the add-on contributes (its settings sections or module screens), e.g. '[\"/admin/settings/common/index/category/seo/section/seo\"]'. The boot-cms job opens each as the end-to-end site's administrator and expects a 200 with a heading and no uncaught script error."
        type: string
        required: false
        default: "[]"
      boot-cms-php-version:
        description: "PHP version the boot-cms job runs the CMS under."
        type: string
        required: false
        default: "8.3"
    secrets:
      CODECOV_TOKEN:
        description: "Codecov upload token. An org-wide token works because the upload passes the calling repository as the slug."
        required: false
      INFECTION_DASHBOARD_API_KEY:
        description: "Stryker dashboard key for publishing mutation reports. Optional; without it the report stays in the job log."
        required: false
      SSH_PRIVATE_KEY:
        description: "Private key loaded into ssh-agent before composer runs, for dependencies Composer clones over SSH (e.g. a private VCS repository). Use a read-only deploy key on the dependency's repository."
        required: false
      AUTODEV_APP_PRIVATE_KEY:
        description: "Private key of the contenir-autodev GitHub App, whose ID is the AUTODEV_APP_ID variable. The boot-cms job uses it for a token that reads the private CMS repository. Org secret in contenir and contenir-extension. Callers outside the contenir org pass it by name: secrets: inherit does not cross organisations."
        required: false

jobs:
  attributions:
    name: "No AI attributions"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Contenir policy: no AI attribution in PR titles, descriptions, commit
      # messages or commit identities. Pull requests check the title,
      # description and every commit on the branch. Pushes check every commit
      # that no other branch already had, so new and force-pushed branches are
      # checked in full rather than by their tip alone.
      - name: Check PR text, commit messages and commit identities
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_REF: ${{ github.ref }}
        run: |
          TEXT_PATTERN='co-authored-by:.*(claude|anthropic)|generated[ -](with|by).*claude|claude\.(ai|com)/code|noreply@anthropic\.com'
          IDENTITY_PATTERN='claude|anthropic'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$TEXT_PATTERN"; then
              echo "::error::PR title or description contains an AI attribution."
              exit 1
            fi
            set -- "origin/${BASE_REF}..HEAD^2"
          elif [ -n "$PUSH_BEFORE" ] && ! printf '%s' "$PUSH_BEFORE" | grep -Eq '^0+$' \
            && git merge-base --is-ancestor "$PUSH_BEFORE" HEAD 2>/dev/null; then
            set -- "${PUSH_BEFORE}..HEAD"
          else
            BRANCH="refs/remotes/origin/${PUSH_REF#refs/heads/}"
            set -- HEAD --not $(git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | grep -vx "$BRANCH")
          fi

          COMMITS=$(git rev-list "$@")
          echo "Checking $(printf '%s' "$COMMITS" | grep -c .) commit(s)."

          FOUND=0
          for COMMIT in $COMMITS; do
            if git log -1 --format='%an <%ae>%n%cn <%ce>' "$COMMIT" | grep -Eiq "$IDENTITY_PATTERN"; then
              echo "::error::$(git log -1 --format='%h "%s" was authored by %an <%ae> and committed by %cn <%ce>.' "$COMMIT")"
              FOUND=1
            fi
            if git log -1 --format=%B "$COMMIT" | grep -Eiq "$TEXT_PATTERN"; then
              echo "::error::$(git log -1 --format='%h "%s" has an AI attribution in its message.' "$COMMIT")"
              FOUND=1
            fi
          done

          if [ "$FOUND" -ne 0 ]; then
            echo "Rewrite the listed commits to remove AI identities and attributions."
            exit 1
          fi

          echo "No attributions found."

  composer:
    name: "Composer"
    if: inputs.enable-composer-validate || inputs.enable-composer-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.coverage-php-version || fromJSON(inputs.php-versions)[0] }}
          coverage: none

      - name: Validate composer.json
        if: inputs.enable-composer-validate
        run: composer validate --strict

      - name: Security audit
        if: (success() || failure()) && inputs.enable-composer-audit
        run: composer audit --locked --abandoned=report

  mago:
    name: "Mago (PHP ${{ matrix.php }})"
    runs-on: ubuntu-24.04
    env:
      HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP and Mago
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.php-extensions }}
          coverage: none
          tools: mago:${{ inputs.mago-version }}

      - name: Load SSH key
        if: env.HAS_SSH_KEY == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress ${{ inputs.composer-options }}

      # Overrides php-version from the consumer's mago.toml for each matrix leg
      # without mutating the committed config file.
      - name: Pin Mago PHP version
        run: echo "MAGO_PHP_VERSION=${{ matrix.php }}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: mago format --check

      - name: Lint
        if: success() || failure()
        run: mago lint

      - name: Analyze
        if: success() || failure()
        run: mago analyze

      - name: Guard
        if: (success() || failure()) && inputs.mago-guard
        run: mago guard

      - name: Rector
        if: (success() || failure()) && inputs.enable-rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

  test:
    name: "Test (PHP ${{ matrix.php }} | ${{ matrix.dependencies }})"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        dependencies: ${{ fromJSON(inputs.dependency-versions) }}
    env:
      HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
      # Coverage is collected on one leg only, and only when something consumes it.
      COVERAGE_LEG: ${{ (inputs.enable-codecov || inputs.enable-infection) && matrix.php == (inputs.coverage-php-version || fromJSON(inputs.php-versions)[0]) && matrix.dependencies == 'locked' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.php-extensions }}
          coverage: ${{ env.COVERAGE_LEG == 'true' && 'pcov' || 'none' }}

      # System tools the tests shell out to (e.g. ImageMagick's CLI). Passed
      # through an env var and word-split, never interpolated into the script.
      - name: Install system packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $APT_PACKAGES

      # DB service is a manual step, not a native `services:` block, because
      # `services:` can't be conditionally omitted per input, and driver
      # packages need different engines (mysql, postgres, mariadb, oracle,
      # mssql, ...). Repos with no DB simply omit `db-image` (default ""),
      # so both steps below are skipped at zero cost.
      - name: Start DB service
        if: inputs.db-image != ''
        run: |
          docker run -d --name db \
            -p ${{ inputs.db-port }}:${{ inputs.db-port }} \
            $(echo '${{ inputs.db-env-json }}' | jq -r 'to_entries[] | "-e \(.key)=\(.value)"' | tr '\n' ' ') \
            ${{ inputs.db-image }}

      - name: Wait for DB to be healthy
        if: inputs.db-image != ''
        run: |
          for i in $(seq 1 ${{ inputs.db-health-retries }}); do
            docker exec db ${{ inputs.db-health-cmd }} && exit 0
            sleep ${{ inputs.db-health-interval-seconds }}
          done
          echo "DB did not become healthy in time" && exit 1

      # Written before composer runs, since an application's install scripts
      # may already boot it. Passed through an env var, never interpolated.
      - name: Write .env
        if: inputs.dotenv != ''
        env:
          DOTENV: ${{ inputs.dotenv }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Load SSH key
        if: env.HAS_SSH_KEY == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Resolve dependencies at the configured strategy level.
      # "locked" uses the committed composer.lock as-is.
      - name: Install dependencies (lowest)
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --no-interaction --no-progress ${{ inputs.composer-options }}

      - name: Install dependencies (locked)
        if: matrix.dependencies == 'locked'
        run: composer install --no-interaction --no-progress ${{ inputs.composer-options }}

      - name: Install dependencies (latest)
        if: matrix.dependencies == 'latest'
        run: composer update --no-interaction --no-progress ${{ inputs.composer-options }}

      # PHPUnit's <env> in phpunit.xml.dist won't override an already-set real
      # env var (no force="true"), so this lets a caller override a connection
      # setting for CI (e.g. DB hostname) without touching that file, which may
      # need a different value for local dev (e.g. Docker Compose networking).
      - name: Export test environment overrides
        if: inputs.test-env-json != '{}'
        run: echo '${{ inputs.test-env-json }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Unit tests
        if: env.COVERAGE_LEG != 'true'
        run: composer ${{ inputs.test-script }}

      - name: Unit tests with coverage
        if: env.COVERAGE_LEG == 'true'
        run: composer ${{ inputs.test-coverage-script }}

      - name: Integration tests
        if: inputs.run-integration
        run: composer ${{ inputs.integration-test-script }}

      - name: Upload coverage artifact
        if: env.COVERAGE_LEG == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: clover.xml

  codecov:
    name: "Codecov"
    needs: [test]
    if: inputs.enable-codecov
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-clover

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # CODECOV_TOKEN is an org-wide upload token, which can't infer the
          # target repo the way a repo-specific token can. `github.repository`
          # resolves to the *calling* repo here, not contenir-qa-tools.
          slug: ${{ github.repository }}
          files: clover.xml
          # Contenir packages are fully covered, so a failed upload (missing
          # token, Codecov outage) must fail the job rather than pass silently.
          fail_ci_if_error: true

  mutation-test:
    name: "Mutation testing"
    needs: [test]
    if: inputs.enable-infection
    runs-on: ubuntu-24.04
    env:
      HAS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY != '' }}
    steps:
      # A diff-only run compares against the base branch, so it needs full
      # history (fetch-depth 0). The condition is inverted because 0 is falsy
      # in expressions: `cond && 0 || 1` would always yield 1.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ !(inputs.infection-diff-on-pull-requests && github.event_name == 'pull_request') && 1 || 0 }}

      - name: Set up PHP and Mago
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.coverage-php-version || fromJSON(inputs.php-versions)[0] }}
          extensions: ${{ inputs.php-extensions }}
          coverage: pcov
          tools: mago:${{ inputs.mago-version }}

      - name: Install system packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update -qq
          # shellcheck disable=SC2086
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $APT_PACKAGES

      - name: Start DB service
        if: inputs.db-image != '' && inputs.run-integration
        run: |
          docker run -d --name db \
            -p ${{ inputs.db-port }}:${{ inputs.db-port }} \
            $(echo '${{ inputs.db-env-json }}' | jq -r 'to_entries[] | "-e \(.key)=\(.value)"' | tr '\n' ' ') \
            ${{ inputs.db-image }}

      - name: Wait for DB to be healthy
        if: inputs.db-image != '' && inputs.run-integration
        run: |
          for i in $(seq 1 ${{ inputs.db-health-retries }}); do
            docker exec db ${{ inputs.db-health-cmd }} && exit 0
            sleep ${{ inputs.db-health-interval-seconds }}
          done
          echo "DB did not become healthy in time" && exit 1

      - name: Write .env
        if: inputs.dotenv != ''
        env:
          DOTENV: ${{ inputs.dotenv }}
        run: printf '%s\n' "$DOTENV" > .env

      - name: Load SSH key
        if: env.HAS_SSH_KEY == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress ${{ inputs.composer-options }}

      - name: Export test environment overrides
        if: inputs.test-env-json != '{}'
        run: echo '${{ inputs.test-env-json }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"

      - name: Pin Mago PHP version
        run: echo "MAGO_PHP_VERSION=${{ inputs.coverage-php-version || fromJSON(inputs.php-versions)[0] }}" >> "$GITHUB_ENV"

      # Mago is invoked internally by Infection itself (staticAnalysisTool config
      # in infection.json5), not by this workflow directly — no needs:[mago] here.
      - name: Mutation testing
        env:
          INFECTION_DASHBOARD_API_KEY: ${{ secrets.INFECTION_DASHBOARD_API_KEY }}
          DIFF_ONLY: ${{ inputs.infection-diff-on-pull-requests && github.event_name == 'pull_request' }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          args=(--min-msi=${{ inputs.min-msi }} --min-covered-msi=${{ inputs.min-covered-msi }} --logger-github)
          if [ "$DIFF_ONLY" = "true" ]; then
            args+=(--git-diff-lines "--git-diff-base=origin/$BASE_REF" --ignore-msi-with-no-mutations)
          fi
          composer ${{ inputs.mutation-test-script }} -- "${args[@]}"

  boot-cms:
    name: "Boot the CMS with the add-on"
    if: inputs.boot-cms
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CMS_REPOSITORY: contenir/contenir-cms-legacy
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: "3306"
      E2E_DB_USERNAME: root
      E2E_DB_PASSWORD: password
    steps:
      - name: Check the app credentials are there
        env:
          APP_ID: ${{ vars.AUTODEV_APP_ID }}
          HAS_KEY: ${{ secrets.AUTODEV_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::boot-cms reads the private CMS repository through the contenir-autodev app: set the AUTODEV_APP_ID variable and pass the AUTODEV_APP_PRIVATE_KEY secret. From outside the contenir org, pass it by name (secrets: AUTODEV_APP_PRIVATE_KEY: ...): secrets: inherit does not cross organisations."
            exit 1
          fi

      - name: Get a token that reads the CMS
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTODEV_APP_ID }}
          private-key: ${{ secrets.AUTODEV_APP_PRIVATE_KEY }}
          owner: contenir
          repositories: contenir-cms-legacy

      # The current release is the highest vX.Y.Z tag. GitHub's "latest
      # release" lags, because not every tag gets a Release.
      - name: Pick the CMS release
        id: cms
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          REF: ${{ inputs.boot-cms-ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(git ls-remote --tags --refs "https://x-access-token:${TOKEN}@github.com/${CMS_REPOSITORY}.git" 'v*' \
              | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          if [ -z "$REF" ]; then
            echo "::error::No vX.Y.Z tag found on ${CMS_REPOSITORY}."
            exit 1
          fi
          echo "Booting ${CMS_REPOSITORY} at ${REF}."
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout the add-on
        uses: actions/checkout@v6
        with:
          path: addon

      - name: Checkout the CMS
        uses: actions/checkout@v6
        with:
          repository: ${{ env.CMS_REPOSITORY }}
          ref: ${{ steps.cms.outputs.ref }}
          token: ${{ steps.app.outputs.token }}
          path: cms

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.boot-cms-php-version }}
          extensions: gd, imagick, pdo_mysql, pdo_sqlite, intl
          coverage: none

      - name: Read the add-on's package
        id: addon
        working-directory: addon
        run: |
          HANDLE=$(jq -r '.extra.contenir.handle // empty' composer.json)
          if [ -z "$HANDLE" ]; then
            echo "::error::composer.json has no extra.contenir.handle: boot-cms is for Contenir add-ons."
            exit 1
          fi
          {
            echo "package=$(jq -r .name composer.json)"
            echo "handle=${HANDLE}"
            echo "alias=$(jq -r '.extra["branch-alias"]["dev-main"] // empty' composer.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: boot-cms-composer-${{ hashFiles('cms/composer.lock', 'addon/composer.json') }}
          restore-keys: boot-cms-composer-

      # The CMS already requires most add-ons, so the pull request's copy
      # replaces the locked one: a path repository at a fixed version, aliased
      # to the add-on's branch alias so other constraints on it still hold.
      # The add-on's own repositories come along, since Composer reads only the
      # root package's. -W updates the add-on and what it needs; everything
      # else stays at the release's lock.
      - name: Install the add-on into the CMS
        working-directory: cms
        env:
          PACKAGE: ${{ steps.addon.outputs.package }}
          ALIAS: ${{ steps.addon.outputs.alias }}
        run: |
          i=0
          jq -c '.repositories // [] | .[]' ../addon/composer.json | while read -r repository; do
            i=$((i + 1))
            composer config "repositories.addon-dependency-${i}" "$repository"
          done
          composer config repositories.addon \
            "$(jq -nc --arg package "$PACKAGE" '{type: "path", url: "../addon", options: {symlink: false, versions: {($package): "dev-boot-cms"}}}')"
          composer require "${PACKAGE}:dev-boot-cms${ALIAS:+ as ${ALIAS}}" -W --no-interaction --no-progress

      - name: Check the manifest lists the add-on
        working-directory: cms
        env:
          HANDLE: ${{ steps.addon.outputs.handle }}
        run: |
          php -r '
            $handles = array_column(require "vendor/contenir/extensions.php", "handle");
            if (! in_array($argv[1], $handles, true)) {
                fwrite(STDERR, "::error::The extension manifest does not list {$argv[1]}: it lists " . implode(", ", $handles) . "\n");
                exit(1);
            }
          ' "$HANDLE"

      # extensions.global.php, not .local: the seed deletes the local file and
      # every test reseeds.
      - name: Enable the add-on on the end-to-end site
        working-directory: cms
        env:
          HANDLE: ${{ steps.addon.outputs.handle }}
        run: |
          php -r '
            $file = "tests/e2e/site/config/autoload/extensions.global.php";
            $config = require $file;
            $config["extensions"]["enabled"] = array_values(array_unique([...$config["extensions"]["enabled"] ?? [], $argv[1]]));
            file_put_contents($file, "<?php\n\nreturn " . var_export($config, true) . ";\n");
          ' "$HANDLE"
          cat tests/e2e/site/config/autoload/extensions.global.php

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: cms/package-lock.json

      - name: Install JS dependencies
        working-directory: cms
        run: npm ci

      - name: Install Chromium
        working-directory: cms
        run: npx playwright install --with-deps chromium

      # One spec beside the CMS's own, using its seed and sign-in helpers, run
      # alone through the CMS's Playwright config with the server's errors
      # kept in a file.
      - name: Write the boot spec
        working-directory: cms
        run: |
          cat > boot-cms.config.mjs <<'JS'
          import base from './playwright.config.mjs'

          export default {
              ...base,
              testMatch: 'boot-cms.spec.mjs',
              webServer: { ...base.webServer, command: `${base.webServer.command} 2>> boot-cms-server.log` },
          }
          JS
          cat > tests/e2e/specs/boot-cms.spec.mjs <<'JS'
          import process from 'node:process'
          import { expect, reseed, signIn, test } from '../support.mjs'

          const handle = process.env.BOOT_CMS_HANDLE
          const pages = JSON.parse(process.env.BOOT_CMS_PAGES || '[]')
          const EXTENSIONS = '/admin/settings/extensions/index/category/system/section/extensions'

          const errors = []
          test.beforeEach(({ page }) => {
              errors.length = 0
              page.on('pageerror', error => errors.push(error.message))
          })
          test.afterEach(() => {
              expect(errors, 'uncaught script errors on the page').toEqual([])
          })

          test('the sign-in page loads', async ({ page }) => {
              const response = await page.goto('/admin/login')

              expect(response?.status()).toBe(200)
              await expect(page.getByLabel('Username')).toBeVisible()
          })

          /**
           * Signs the administrator in to a site whose code was just deployed, as a
           * release reaches a live site: the update check runs, and with it the
           * migrations of the add-ons the site enables, which the seed doesn't run.
           */
          async function signInAfterDeploy(page) {
              reseed(['--unverified'])
              await signIn(page, 'administrator')
              await expect(page.getByRole('heading', { name: 'CMS update check' })).toBeVisible()
          }

          test(`the update check reports no load failure for ${handle}`, async ({ page }) => {
              await signInAfterDeploy(page)

              await expect(page.getByText(`Extension ${handle} could not load`)).toHaveCount(0)
          })

          test(`Site Settings › Extensions shows ${handle} enabled and healthy`, async ({ page }) => {
              await signInAfterDeploy(page)
              await page.goto(EXTENSIONS)

              const row = page.locator(`[data-extension="${handle}"]`)
              await expect(row.locator('[data-extension-state]')).toHaveText('Enabled')
              await expect(row.locator('[data-extension-health]')).toHaveText('Healthy')
          })

          for (const path of pages) {
              test(`${path} renders for the administrator`, async ({ page }) => {
                  await signInAfterDeploy(page)

                  const response = await page.goto(path)

                  expect(response?.status()).toBe(200)
                  await expect(page.locator('h1').first()).toBeVisible()
              })
          }
          JS

      - name: Boot the CMS and check the add-on
        working-directory: cms
        env:
          BOOT_CMS_HANDLE: ${{ steps.addon.outputs.handle }}
          BOOT_CMS_PAGES: ${{ inputs.boot-cms-pages }}
        run: npx playwright test --config boot-cms.config.mjs

      - name: Check the server logged no PHP errors from the add-on
        if: success() || failure()
        working-directory: cms
        env:
          PACKAGE: ${{ steps.addon.outputs.package }}
        run: |
          touch boot-cms-server.log
          if grep -E 'PHP (Fatal error|Parse error|Warning|Notice|Deprecated)' boot-cms-server.log | grep -F "vendor/${PACKAGE}/"; then
            echo "::error::The CMS logged PHP errors from ${PACKAGE} (above)."
            exit 1
          fi
          echo "No PHP errors from ${PACKAGE}."

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: boot-cms-report
          path: |
            cms/playwright-report/
            cms/test-results/
            cms/boot-cms-server.log
          retention-days: 7
